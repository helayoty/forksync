name: reusable-sync

# Tag lane. Call from the fork on a schedule; opens/updates one PR per new
# upstream final tag. Conflicts → draft PR with owners listed; the owner
# re-applies the patch on the sync branch. Those manual resolutions are
# learned into rerere and shared via the `forksync/rerere` branch, and a sync
# branch carrying manual commits is never regenerated by the bot.

on:
  workflow_call:
    inputs:
      upstream-repo:   { type: string, required: true }
      ref:             { type: string, default: "" }          # explicit tag/sha; default = latest final tag
      tag-glob:        { type: string, default: "v*" }
      head:            { type: string, default: main }
      sync-owner:      { type: string, default: "@forksync-bot" }
      forksync-version: { type: string, default: "" }         # vX.Y.Z = verified release asset; "" = build from this workflow's commit
      forksync-repo:   { type: string, default: FORKSYNC_OWNER/forksync }
      forksync-image:   { type: string, default: "" }      # override; default derives ghcr.io/<owner>/forksync:<forksync-version>
    secrets:
      token:
        description: Optional PAT/App token. Without it GITHUB_TOKEN is used — works only if forksync is public, and the PRs this creates will not trigger other workflows (no patch-policy check on sync PRs).
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forksync-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          # Credentials intentionally persisted: this job pushes sync/* and forksync/rerere below.
          token: ${{ secrets.token || github.token }} # zizmor: ignore[artipacked]

      # forksync itself, at the exact commit of this reusable workflow file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.forksync-repo }}
          ref: ${{ job.workflow_sha }}
          path: .forksync
          token: ${{ secrets.token || github.token }}
          persist-credentials: false

      - id: fsimg
        env:
          FS_REPO: ${{ inputs.forksync-repo }}
          FS_VERSION: ${{ inputs.forksync-version }}
          FS_IMAGE: ${{ inputs.forksync-image }}
        run: |
          IMG="$FS_IMAGE"
          if [ -z "$IMG" ] && [[ "$FS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then OWNER="${FS_REPO%%/*}"; IMG="ghcr.io/${OWNER,,}/forksync:${FS_VERSION}"; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - id: setup
        uses: ./.forksync/setup
        with:
          image: ${{ steps.fsimg.outputs.image }}
          version: ${{ inputs.forksync-version }}
          token: ${{ secrets.token || github.token }}
          upstream-repo: ${{ inputs.upstream-repo }}
          repo: ${{ inputs.forksync-repo }}

      - name: Pull shared rerere cache
        run: forksync rerere pull --remote origin

      - id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
          TAG_GLOB: ${{ inputs.tag-glob }}
        run: |
          REF="$INPUT_REF"
          [ -n "$REF" ] || REF=$(forksync latest-tag --remote upstream --pattern "$TAG_GLOB")
          CUR=$(cat UPSTREAM_BASE)
          { echo "ref=$REF"; echo "cur=$CUR"; echo "changed=$([ "$REF" != "$CUR" ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      - name: Inspect existing sync branch
        id: existing
        if: steps.target.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REF: ${{ steps.target.outputs.ref }}
          HEAD_BRANCH: ${{ inputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags upstream "refs/tags/${REF}:refs/tags/${REF}" 2>/dev/null || git fetch --no-tags upstream "$REF"
          LEASE=""; SKIP=false
          set +e; git ls-remote --exit-code --heads origin "refs/heads/sync/${REF}" >/dev/null; rc=$?; set -e
          case $rc in
            0) ;;                                   # branch exists
            2) { echo "lease="; echo "skip=false"; } >> "$GITHUB_OUTPUT"; exit 0 ;;   # new branch
            *) exit $rc ;;
          esac
          git fetch --no-tags origin "+refs/heads/sync/${REF}:refs/remotes/origin/sync/${REF}"
          LEASE=$(git rev-parse "refs/remotes/origin/sync/${REF}")
          forksync rerere train --sync-branch "origin/sync/${REF}" --head "$HEAD_BRANCH" --upstream upstream
          set +e; HUMAN=$(forksync human-commits --base "$REF" --branch "origin/sync/${REF}"); rc=$?; set -e
          case $rc in
            0)
              SKIP=true
              echo "::notice::sync/${REF} has manual commits; not regenerated"
              echo "$HUMAN"
              MARK='<!-- forksync:manual-commits -->'
              if gh pr view "sync/${REF}" --json number >/dev/null 2>&1; then
                if ! gh pr view "sync/${REF}" --json comments --jq '.comments[].body' | grep -qF "$MARK"; then
                  gh pr comment "sync/${REF}" --body "sync branch has manual commits; not regenerated. Delete the branch or merge the PR to let the bot resync.
          ${MARK}"
                fi
              fi
              ;;
            3) ;;
            *) exit $rc ;;
          esac
          { echo "lease=$LEASE"; echo "skip=$SKIP"; } >> "$GITHUB_OUTPUT"

      - if: steps.target.outputs.changed == 'true' && steps.existing.outputs.skip != 'true'
        id: sync
        env:
          REF: ${{ steps.target.outputs.ref }}
          HEAD_BRANCH: ${{ inputs.head }}
          SYNC_OWNER: ${{ inputs.sync-owner }}
        run: |
          set +e
          forksync sync --remote upstream --ref "$REF" \
            --head "$HEAD_BRANCH" --owner "$SYNC_OWNER" --report "$RUNNER_TEMP/report.md"
          rc=$?; set -e
          case $rc in
            0) echo "draft=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "draft=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit $rc ;;
          esac

      - if: steps.target.outputs.changed == 'true' && steps.existing.outputs.skip != 'true'
        env:
          REF: ${{ steps.target.outputs.ref }}
          LEASE: ${{ steps.existing.outputs.lease }}   # sha fetched above; empty = branch must not exist yet
        run: git push --force-with-lease="refs/heads/sync/${REF}:${LEASE}" origin "HEAD:refs/heads/sync/${REF}"

      - if: steps.target.outputs.changed == 'true' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REF: ${{ steps.target.outputs.ref }}
          CUR: ${{ steps.target.outputs.cur }}
          IS_DRAFT: ${{ steps.sync.outputs.draft }}
          HEAD_BRANCH: ${{ inputs.head }}
        run: |
          TITLE="sync: ${CUR} → ${REF}"; BODY="$RUNNER_TEMP/report.md"
          DRAFT=""; [ "$IS_DRAFT" = true ] && DRAFT="--draft"
          gh label create upstream-sync --force >/dev/null 2>&1 || true
          gh label create needs-conflict-resolution --color B60205 --force >/dev/null 2>&1 || true
          if gh pr view "sync/${REF}" --json number >/dev/null 2>&1; then
            gh pr edit "sync/${REF}" --title "$TITLE" --body-file "$BODY"
          else
            gh pr create --base "$HEAD_BRANCH" --head "sync/${REF}" --title "$TITLE" --body-file "$BODY" --label upstream-sync $DRAFT
          fi
          [ -z "$DRAFT" ] || gh pr edit "sync/${REF}" --add-label needs-conflict-resolution

      - name: Push shared rerere cache
        if: always() && steps.setup.outcome == 'success'
        run: forksync rerere push --remote origin
