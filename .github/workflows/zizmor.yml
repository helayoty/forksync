name: zizmor
# Self-lint. Forks import reusable-*.yml and receive the scaffold templates
# verbatim, so a zizmor finding here becomes a finding in every fork's CI.
# Two inputs: this repo's own workflows, and the scaffold templates rendered
# with dummy values (placeholders such as @FORKSYNC_SHA are not valid refs).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render scaffold templates as a fork would receive them
        run: |
          set -euo pipefail
          mkdir -p rendered/.github/workflows
          for f in internal/scaffold/templates/github/*.yml; do
            sed -e 's#FORKSYNC_OWNER/forksync#helayoty/forksync#g' \
                -e 's#FORKSYNC_SHA#0123456789abcdef0123456789abcdef01234567#g' \
                -e 's#FORKSYNC_VERSION#v0.0.0#g' \
                -e 's#UPSTREAM_REPO#kubernetes/kubernetes#g' \
                -e 's#TAG_GLOB#v*#g' -e 's#BACKPORT_STYLE#k8s#g' \
                "$f" > "rendered/.github/workflows/$(basename "$f")"
          done
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: . rendered
