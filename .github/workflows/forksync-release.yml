name: forksync-release
# INTERNAL — releases forksync itself. Not callable from other repos (no
# workflow_call). Forks release THEIR software through reusable-release.yml.
#
#   Actions → forksync-release → Run workflow → bump: patch | minor | major (or an explicit version)
#
# prepare: tests, replaces the FORKSYNC_OWNER placeholder with this repo's owner
#          (first release only; no-op afterwards), commits, tags vX.Y.Z, pushes.
# publish: goreleaser from that tag — archives, deb/rpm, SBOMs, cosign-signed
#          checksums, signed multi-arch image on ghcr.io, SLSA provenance.
#
# The two jobs are chained in one run on purpose: a tag pushed with
# GITHUB_TOKEN would not trigger a separate `on: push: tags` workflow. A tag
# pushed by a human still works through the `push` trigger below.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump from the latest vX.Y.Z tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: explicit version (vX.Y.Z); overrides bump
        default: ""
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write      # release commit, tag, GitHub release
  packages: write      # ghcr.io push
  id-token: write      # cosign keyless + attestations
  attestations: write

concurrency:
  group: forksync-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Credentials intentionally persisted: this job pushes the release commit and tag.
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - run: go vet ./... && go test ./...

      - name: Replace FORKSYNC_OWNER placeholder (first release only)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Only files whose *defaults* must point at this repo. Scaffold templates
          # and Go code keep the placeholder: `forksync init` substitutes those.
          FILES=$(grep -l 'FORKSYNC_OWNER' .github/workflows/reusable-*.yml templates/ado/build-template.yml 2>/dev/null || true)
          [ -z "$FILES" ] && { echo "placeholder already replaced"; exit 0; }
          echo "$FILES" | xargs sed -i "s#FORKSYNC_OWNER#${OWNER}#g"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: bind reusable workflows and templates to ${OWNER}/forksync"

      - name: Compute version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT" ]; then
            [[ "$EXPLICIT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be vX.Y.Z"; exit 1; }
            TAG="$EXPLICIT"
          else
            LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            LAST="${LAST:-v0.0.0}"; IFS=. read -r MA MI PA <<<"${LAST#v}"
            case "$BUMP" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
            esac
            TAG="v${MA}.${MI}.${PA}"
          fi
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && { echo "::error::$TAG already exists"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG (previous: ${LAST:-n/a})"

      - name: Tag and push
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "forksync $TAG"
          git push origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"

  publish:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Sanity-check the tree
        run: |
          set -euo pipefail
          for f in .goreleaser.yaml Dockerfile setup/action.yml .github/workflows/reusable-sync.yml; do
            [ -f "$f" ] || { echo "::error::$f is missing — the repo is not a complete forksync checkout"; exit 1; }
          done
          for f in .github/workflows/upstream-sync.yml azure-pipelines.yml UPSTREAM_BASE; do
            [ ! -e "$f" ] || { echo "::error::$f belongs in a fork, not in forksync (was 'forksync init' run here?)"; exit 1; }
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - run: go test ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lower=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { version: "~> v2", args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          IMAGE_OWNER: ${{ steps.owner.outputs.lower }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}   # optional
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      - id: image
        run: |
          set -euo pipefail
          DIGEST=$(jq -r '[.[] | select(.type=="Docker Manifest") | .extra.Digest][0] // empty' dist/artifacts.json)
          [ -n "$DIGEST" ] || { echo "::error::no Docker Manifest digest in dist/artifacts.json"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.lower }}/forksync
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Pin hint for consumers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          printf '\n---\nConsumers: `forksync init … --forksync-version %s --forksync-sha %s`\n' "$TAG" "$SHA" > note.md
          gh release edit "$TAG" --notes-file <(gh release view "$TAG" --json body -q .body; cat note.md)
